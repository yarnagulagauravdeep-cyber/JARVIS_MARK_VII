<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S · Mark VII</title>
<style>
/* ─── Design Tokens (Pitch Black & Neon Green) ─────────── */
:root {
  --bg: #000000;
  --surface: #000000;
  --line: rgba(0, 255, 102, 0.16);
  --line-strong: rgba(0, 255, 102, 0.38);
  --text: #e5e7eb;
  --text-dim: #6b7280;
  --text-faint: #374151;
  --jarvis: #00ff66;
  --accent: #00ff66;
  --font-sans: Inter, "SF Pro Display", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

/* ─── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #000000;
  color: var(--text);
  font: 13px/1.5 var(--font-sans);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 1px solid var(--jarvis); outline-offset: 2px; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0, 255, 102, 0.25); border-radius: 2px; }

/* ─── Background Canvas ────────────────────────────────── */
#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: #000000;
}

/* ─── App Grid: Pure 3-Column Minimal HUD ──────────────── */
#app {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(310px, 26vw) 1fr minmax(310px, 26vw);
  grid-template-rows: 1fr;
  gap: 20px;
  padding: 24px 28px;
}

/* ─── Columns & Black Bordered Panels ───────────────────── */
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
#center { min-height: 0; pointer-events: none; }

.panel {
  background: #000000;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  transition: border-color 0.25s ease;
}
.panel:hover { border-color: var(--line-strong); }

.panel h2 {
  font: 600 10px var(--font-mono);
  letter-spacing: 0.18em;
  color: var(--jarvis);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.clear-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text-dim);
  font: 600 9px var(--font-mono);
  letter-spacing: 0.12em;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
}
.clear-btn:hover {
  border-color: var(--jarvis);
  color: var(--jarvis);
  background: rgba(0, 255, 102, 0.08);
  box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
}
.grow { flex: 1; }

/* ─── Chat Stream ───────────────────────────────────────── */
#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
}

.m {
  padding: 10px 14px;
  border-radius: 8px;
  animation: messageIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  line-height: 1.5;
  font-size: 12.5px;
  position: relative;
  background: #000000;
}
@keyframes messageIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
.m i {
  display: block;
  font-style: normal;
  letter-spacing: 0.12em;
  margin-bottom: 3px;
  font-size: 9px;
  font-weight: 600;
  font-family: var(--font-mono);
}
.m.you {
  background: #000000;
  color: #d1d5db;
  align-self: flex-end;
  width: 88%;
  border: 1px solid #141414;
}
.m.you i { color: var(--text-dim); }
.m.jarvis {
  color: #ffffff;
  background: #000000;
  border: 1px solid rgba(0, 255, 102, 0.2);
  border-left: 2px solid var(--jarvis);
  border-radius: 2px 8px 8px 2px;
  align-self: flex-start;
  width: 92%;
}
.m.jarvis i { color: var(--jarvis); }
.m.sys {
  color: var(--text-faint);
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 4px 8px;
  background: transparent;
  border: none;
}
.m small {
  color: var(--text-faint);
  font-size: 9px;
  float: right;
  margin-left: 8px;
  font-family: var(--font-mono);
}

/* ─── Chat Prompt Form ──────────────────────────────────── */
.chat-prompt {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #000000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  margin-top: 10px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.chat-prompt:focus-within {
  border-color: var(--jarvis);
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.18);
}
.prompt-arrow {
  color: var(--jarvis);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}
#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #ffffff;
  font: 12px/1.4 var(--font-mono);
  outline: none;
}
#cmd-input::placeholder {
  color: #4b5563;
}
#cmd-send {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--jarvis);
  font: 600 9px var(--font-mono);
  letter-spacing: 0.14em;
  padding: 4px 9px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}
#cmd-send:hover {
  background: var(--jarvis);
  color: #000000;
}

/* ─── System Vitals ─────────────────────────────────────── */
.vit {
  display: grid;
  grid-template-columns: 64px 1fr 62px;
  gap: 10px 12px;
  align-items: center;
}
.vit b {
  font-weight: 500;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  font-size: 10px;
  font-family: var(--font-mono);
}
.bar {
  height: 5px;
  background: #0a0a0a;
  border: 1px solid rgba(0, 255, 102, 0.15);
  border-radius: 99px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--jarvis);
  box-shadow: 0 0 8px var(--jarvis);
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.vit span {
  text-align: right;
  color: var(--jarvis);
  font-size: 11px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* ─── Stocks List ───────────────────────────────────────── */
#stocks {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.srow {
  display: grid;
  grid-template-columns: 1fr 75px auto;
  gap: 2px 10px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid #111111;
}
.srow:last-child { border-bottom: none; }
.sn { font-weight: 600; color: #fff; font-size: 11.5px; }
.ss { font-size: 9px; color: var(--text-faint); font-family: var(--font-mono); }
.spark { width: 75px; height: 20px; }
.sr { text-align: right; }
.sp { font-weight: 600; color: #fff; font-size: 11.5px; font-family: var(--font-mono); }
.sc { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
.up { color: var(--jarvis); }
.dn { color: #f87171; }
.sa {
  grid-column: 1 / 4;
  font-size: 9px;
  color: var(--text-faint);
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  font-family: var(--font-mono);
}
.signal-badge {
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 8.5px;
  font-weight: 600;
}
.sig-buy { background: rgba(0, 255, 102, 0.1); color: var(--jarvis); border: 1px solid var(--line-strong); }
.sig-sell { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
.sig-hold { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid #222; }

/* ─── Init Overlay ──────────────────────────────────────── */
#init-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  cursor: pointer;
  transition: opacity 0.45s ease;
}
#init-overlay.hidden { opacity: 0; pointer-events: none; }
.init-ring {
  width: 76px;
  height: 76px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
  animation: pulseDot 2.4s ease infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
.init-title {
  font: 700 18px var(--font-sans);
  letter-spacing: 0.34em;
  color: var(--jarvis);
  text-shadow: 0 0 16px rgba(0, 255, 102, 0.4);
}
.init-sub {
  color: var(--text-dim);
  font: 500 10px var(--font-mono);
  letter-spacing: 0.18em;
}

/* ─── Hidden Logic Container (Keeps all backend bindings 100% functional) ─── */
.logic-hidden {
  display: none !important;
}

/* ─── Responsive ────────────────────────────────────────── */
@media (max-width: 1100px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    overflow-y: auto;
    padding: 12px 16px;
  }
  .col { min-height: 280px; }
  #center { display: none; }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Init Overlay -->
<div id="init-overlay">
  <div class="init-ring">
    <div style="width: 10px; height: 10px; background: var(--jarvis); border-radius: 50%; box-shadow: 0 0 12px var(--jarvis);"></div>
  </div>
  <div class="init-title">INITIALIZE J.A.R.V.I.S</div>
  <div class="init-sub">CLICK ANYWHERE TO ENGAGE HANDS-FREE VOICE MONITOR</div>
</div>

<div id="app">
  <!-- Left: Communications Stream -->
  <section class="col">
    <div class="panel grow">
      <h2>
        <span>COMMUNICATIONS STREAM</span>
        <div style="display:flex; gap:6px;">
          <button type="button" id="btn-test-voice" class="clear-btn" title="Test Voice Output">🔊 VOICE TEST</button>
          <button type="button" id="btn-clear-chat" class="clear-btn" title="Clear chat history and start fresh">CLEAR &amp; NEW</button>
        </div>
      </h2>
      <div id="chat"></div>
      <form id="chat-form" class="chat-prompt">
        <span class="prompt-arrow">&gt;</span>
        <input type="text" id="cmd-input" placeholder="Type command or speak aloud naturally..." autocomplete="off">
        <button type="submit" id="cmd-send">RUN</button>
      </form>
    </div>
  </section>

  <!-- Center: Arc Reactor Space -->
  <section id="center"></section>

  <!-- Right: Hardware Diagnostics & Market Telemetry -->
  <section class="col">
    <div class="panel">
      <h2><span>SYSTEM HARDWARE DIAGNOSTICS</span></h2>
      <div class="vit" id="vit"></div>
    </div>

    <div class="panel grow">
      <h2><span>LIVE MARKET TELEMETRY</span> <span id="mood" style="color: var(--text-dim); font-size: 9px;"></span></h2>
      <div id="stocks"></div>
    </div>
  </section>
</div>

<!-- Hidden Logic Store: Preserves all JS bindings without displaying on screen -->
<div class="logic-hidden">
  <span id="mode"></span>
  <div id="time"></div>
  <div id="date"></div>
  <div id="voice-badge"><span id="voice-status-text"></span></div>
  <span id="mic-status-label"></span>
  <canvas id="wave"></canvas>
  <div id="core">
    <div id="cst"></div>
    <div id="cnote"></div>
    <div id="heard"></div>
  </div>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
function el(t, c, x) {
  const e = document.createElement(t);
  if (c) e.className = c;
  if (x !== undefined) e.textContent = x;
  return e;
}

const LABEL = {
  listening: 'LISTENING',
  recognizing: 'HEARING YOU',
  thinking: 'PROCESSING QUERY',
  speaking: 'JARVIS RESPONDING',
  starting: 'CALIBRATING',
  off: 'STANDBY'
};

let S = null, lastOk = 0, level = 0, amp = 0;
let seenChat = 0, stockSig = '', lastSt = '';
let isJarvisSpeaking = false;
let continuousVoice = true;
let isExecuting = false;

const bg = $('#bg'), g = bg.getContext('2d'), wv = $('#wave'), wg = wv.getContext('2d');
let W = 0, H = 0, DPR = 1, R = 300, CX = 0, CY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth;
  H = innerHeight;
  bg.width = W * DPR;
  bg.height = H * DPR;
  bg.style.width = W + 'px';
  bg.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  wv.width = (wv.clientWidth || 160) * DPR;
  wv.height = (wv.clientHeight || 28) * DPR;
  wg.setTransform(DPR, 0, 0, DPR, 0, 0);

  R = Math.min(W * 0.16, H * 0.32);
  CX = W / 2;
  CY = H / 2;
  const core = $('#core');
  if (core) core.style.top = (CY + R + 16) + 'px';
}
addEventListener('resize', resize);
resize();

/* ---------- Cross-Browser Text-to-Speech Engine (Firefox & Chromium) ---------- */
let activeUtterance = null;
let lastSpokenText = '';
let lastSpokenTime = 0;
let cachedVoices = [];

function loadVoices() {
  if (!('speechSynthesis' in window)) return [];
  cachedVoices = window.speechSynthesis.getVoices() || [];
  return cachedVoices;
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    loadVoices();
  };
}

function speakInBrowser(text) {
  if (!text || !('speechSynthesis' in window)) return;

  const clean = text.trim();
  if (!clean) return;

  // Deduplication: prevent repeat triggers of identical text within 3 seconds
  const now = Date.now();
  if (clean === lastSpokenText && (now - lastSpokenTime) < 3000) {
    return;
  }
  lastSpokenText = clean;
  lastSpokenTime = now;

  try {
    // Unfreeze synthesis if paused (vital in Firefox)
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }

    // Only cancel if actively speaking
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
    }

    setTimeout(() => {
      try {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }

        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'en-US';
        u.rate = 1.0;
        u.pitch = 1.0;
        u.volume = 1.0;

        // Prioritize natural English voices
        const voices = cachedVoices.length ? cachedVoices : loadVoices();
        if (voices && voices.length) {
          let chosen = voices.find(v => v.lang && v.lang.startsWith('en') && (
            v.name.includes('David') || v.name.includes('Natural') || v.name.includes('Google') ||
            v.name.includes('Mark') || v.name.includes('George') || v.name.includes('Zira')
          ));
          if (!chosen) {
            chosen = voices.find(v => v.lang && v.lang.startsWith('en'));
          }
          if (chosen) {
            u.voice = chosen;
          }
        }

        u.onstart = () => {
          isJarvisSpeaking = true;
          if (recognition) {
            try { recognition.abort(); } catch(e) {}
          }
        };

        const onFinished = () => {
          isJarvisSpeaking = false;
          activeUtterance = null;
          window._jarvisUtterance = null;
          setTimeout(() => {
            if (continuousVoice && recognition) {
              try { recognition.start(); } catch(e) {}
            }
          }, 350);
        };

        u.onend = onFinished;
        u.onerror = (e) => {
          console.warn('Speech synthesis notice:', e);
          onFinished();
        };

        // Retain global reference to bypass Firefox GC bug (Bugzilla 1461875)
        activeUtterance = u;
        window._jarvisUtterance = u;

        window.speechSynthesis.speak(u);

        // Keep Firefox speaking active
        const heartbeat = setInterval(() => {
          if (!window.speechSynthesis.speaking) {
            clearInterval(heartbeat);
          } else if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
        }, 300);

      } catch(err) {
        console.error('TTS execution error:', err);
        isJarvisSpeaking = false;
      }
    }, 40);

  } catch(e) {
    console.error('Speech setup error:', e);
  }
}

/* ---------- Command Execution ---------- */
async function sendCommand(text) {
  if (!text || !text.trim() || isExecuting) return;
  isExecuting = true;

  const clean = text.trim();
  const heard = $('#heard');
  if (heard) heard.textContent = '> "' + clean + '"';

  try {
    const resp = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: clean })
    });
    const data = await resp.json();
    if (data.reply) {
      speakInBrowser(data.reply);
    }
  } catch(e) {
    console.error('Command execution error:', e);
  } finally {
    isExecuting = false;
    const inp = $('#cmd-input');
    if (inp) inp.value = '';
  }
}

const chatForm = $('#chat-form');
if (chatForm) {
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = $('#cmd-input');
    if (inp && inp.value.trim()) {
      sendCommand(inp.value.trim());
      inp.value = '';
    }
  });
}

const voiceTestBtn = $('#btn-test-voice');
if (voiceTestBtn) {
  voiceTestBtn.addEventListener('click', () => {
    speakInBrowser("Voice synthesis online. Systems fully operational.");
  });
}

const clearBtn = $('#btn-clear-chat');
if (clearBtn) {
  clearBtn.addEventListener('click', async () => {
    try {
      clearBtn.textContent = 'CLEARING...';
      const resp = await fetch('/api/chat/clear', { method: 'POST', cache: 'no-store' });
      const data = await resp.json();
      const cb = $('#chat');
      if (cb) cb.innerHTML = '';
      seenChat = 0;
      if (data && data.chat) {
        for (const m of data.chat) {
          seenChat = Math.max(seenChat, m.i);
          const d = el('div', 'm ' + m.k);
          const header = el('i', '', m.k === 'you' ? 'USER' : (m.k === 'jarvis' ? 'J.A.R.V.I.S' : 'SYSTEM'));
          header.append(el('small', '', m.t));
          d.append(header, document.createTextNode(m.x));
          cb.append(d);
        }
      }
    } catch(e) {
      console.error('Failed to clear chat:', e);
      const cb = $('#chat');
      if (cb) cb.innerHTML = '';
      seenChat = 0;
    } finally {
      clearBtn.textContent = 'CLEAR & NEW';
    }
  });
}

window.executeChip = function(text) {
  sendCommand(text);
};

/* ---------- Continuous Hands-Free Speech Recognition ---------- */
let recognition = null;
let speechDebounceTimer = null;

function initContinuousSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    console.warn('SpeechRecognition API not available in this browser.');
    const cb = $('#chat');
    if (cb && !$('#ff-mic-notice')) {
      const hint = el('div', 'm sys', 'NOTICE: Firefox does not support Web Speech Recognition by default. Type your commands in the prompt below, or use Google Chrome / Microsoft Edge for hands-free microphone listening.');
      hint.id = 'ff-mic-notice';
      cb.append(hint);
    }
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    if (isJarvisSpeaking || isExecuting) return;

    let interim = '';
    let finalChunk = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      if (res.isFinal) {
        finalChunk += res[0].transcript;
      } else {
        interim += res[0].transcript;
      }
    }

    const liveText = (finalChunk || interim).trim();
    const heard = $('#heard');
    if (heard && liveText) {
      heard.textContent = '> "' + liveText + '"';
    }

    if (finalChunk.trim().length > 1) {
      clearTimeout(speechDebounceTimer);
      const query = finalChunk.trim();
      finalChunk = '';
      sendCommand(query);
    } else if (interim.trim().length > 1) {
      clearTimeout(speechDebounceTimer);
      speechDebounceTimer = setTimeout(() => {
        if (!isJarvisSpeaking && !isExecuting && interim.trim().length > 1) {
          sendCommand(interim.trim());
        }
      }, 1300);
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') console.log('Recognition notice:', e.error);
  };

  recognition.onend = () => {
    if (continuousVoice && !isJarvisSpeaking) {
      setTimeout(() => {
        try { recognition.start(); } catch(e) {}
      }, 200);
    }
  };

  try {
    recognition.start();
  } catch(e) {}
}

// Initial gesture overlay for audio permission
const overlay = $('#init-overlay');
function engageJarvis() {
  overlay.classList.add('hidden');
  initContinuousSpeech();
  loadVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.resume();
    try {
      const prime = new SpeechSynthesisUtterance(' ');
      prime.volume = 0.01;
      window.speechSynthesis.speak(prime);
    } catch(e) {}
    setTimeout(() => {
      speakInBrowser("Good day, sir. All systems are operational.");
    }, 250);
  }
  const inp = $('#cmd-input');
  if (inp) inp.focus();
}
overlay.addEventListener('click', engageJarvis);
document.body.addEventListener('keydown', () => {
  if (!overlay.classList.contains('hidden')) engageJarvis();
}, { once: true });

/* ---------- Clock ---------- */
setInterval(() => {
  const d = new Date();
  const t = $('#time'), dt = $('#date');
  if (t) t.textContent = d.toLocaleTimeString('en-GB');
  if (dt) dt.textContent = d.toLocaleDateString('en-GB', {
    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
  }).toUpperCase();
}, 1000);

/* ---------- Poll State from Backend Server ---------- */
async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const j = await r.json();
    S = j;
    lastOk = Date.now();
    render(j);
  } catch(e) {}
  setTimeout(poll, 500);
}

function fmt(n) {
  return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

function spark(a, up) {
  const NS = 'http://www.w3.org/2000/svg';
  const sv = document.createElementNS(NS, 'svg');
  sv.setAttribute('viewBox', '0 0 75 20');
  sv.setAttribute('class', 'spark');
  if (!a || a.length < 2) return sv;
  const mn = Math.min(...a), mx = Math.max(...a), d = (mx - mn) || 1;
  const pts = a.map((v, i) => (i / (a.length - 1) * 75).toFixed(1) + ',' + (18 - ((v - mn) / d) * 16).toFixed(1)).join(' ');
  const p = document.createElementNS(NS, 'polyline');
  p.setAttribute('points', pts);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', up ? '#00ff66' : '#f87171');
  p.setAttribute('stroke-width', '1.5');
  sv.appendChild(p);
  return sv;
}

function renderStocks(list) {
  const box = $('#stocks');
  if (!box) return;
  box.textContent = '';
  let up = 0, dn = 0;
  if (!list || !list.length) {
    box.append(el('div', 'ss', 'Awaiting market telemetry...'));
    return;
  }
  for (const s of list) {
    const row = el('div', 'srow');
    const l = el('div');
    l.append(el('div', 'sn', s.name || s.sym));
    if (s.err) {
      l.append(el('div', 'ss', s.sym + ' · OFFLINE'));
      row.append(l);
      box.append(row);
      continue;
    }
    l.append(el('div', 'ss', s.sym + (s.stale ? ' · CACHED' : ' · LIVE')));
    const upx = s.pct >= 0;
    if (s.pct > 0) up++;
    if (s.pct < 0) dn++;
    const r = el('div', 'sr');
    r.append(
      el('div', 'sp', fmt(s.price)),
      el('div', 'sc ' + (upx ? 'up' : 'dn'), (upx ? '▲ +' : '▼ ') + Math.abs(s.pct).toFixed(2) + '%')
    );
    row.append(l, spark(s.spark, upx), r);

    let sigClass = 'sig-hold', sigText = s.signal || 'HOLD';
    if (sigText.includes('BUY')) sigClass = 'sig-buy';
    else if (sigText.includes('SELL')) sigClass = 'sig-sell';

    const metaRow = el('div', 'sa');
    metaRow.append(
      el('span', '', 'MOMENTUM ' + (s.mom >= 0 ? '+' : '') + s.mom + '%'),
      el('span', 'signal-badge ' + sigClass, sigText)
    );
    row.append(metaRow);
    box.append(row);
  }
  const mood = $('#mood');
  if (mood) mood.textContent = list.length ? up + ' BULL / ' + dn + ' BEAR' : '';
}

function render(j) {
  const st = isJarvisSpeaking ? 'speaking' : (isExecuting ? 'thinking' : (j.state || 'idle'));

  const cst = $('#cst');
  if (cst && !isExecuting && !isJarvisSpeaking) {
    cst.textContent = LABEL[st] || String(st).toUpperCase();
  }
  const cnote = $('#cnote');
  if (cnote) cnote.textContent = (j.note && j.note !== 'Ready') ? j.note : 'SYSTEM OPERATIONAL';
  const mode = $('#mode');
  if (mode) mode.textContent = (j.mode || 'HYBRID').toUpperCase() + ' MODE';

  const cb = $('#chat');
  if (cb) {
    if (j.chat && j.chat.length > 0 && j.chat[j.chat.length - 1].i < seenChat) {
      cb.innerHTML = '';
      seenChat = 0;
    }
    let added = false;
    for (const m of j.chat) {
      if (m.i > seenChat) {
        seenChat = m.i;
        added = true;
        const d = el('div', 'm ' + m.k);
        const header = el('i', '', m.k === 'you' ? 'USER' : (m.k === 'jarvis' ? 'J.A.R.V.I.S' : 'SYSTEM'));
        header.append(el('small', '', m.t));
        d.append(header, document.createTextNode(m.x));
        cb.append(d);
        if (m.k === 'jarvis' && seenChat > 2 && m.x !== lastSpokenText) {
          speakInBrowser(m.x);
        }
      }
    }
    if (added) {
      while (cb.children.length > 60) cb.removeChild(cb.firstChild);
      cb.scrollTop = cb.scrollHeight;
    }
  }

  const ss = JSON.stringify(j.stocks);
  if (ss !== stockSig) {
    stockSig = ss;
    renderStocks(j.stocks);
  }

  const v = $('#vit');
  if (v) {
    v.textContent = '';
    const sy = j.sys || {};
    function bar(n, val, txt) {
      if (val === undefined || val === null) return;
      const b = el('div', 'bar');
      const i = document.createElement('i');
      i.style.width = Math.max(0, Math.min(100, val)) + '%';
      b.append(i);
      v.append(el('b', '', n), b, el('span', '', txt));
    }
    bar('CPU', sy.cpu, Math.round(sy.cpu || 0) + '%');
    bar('RAM', sy.ram, Math.round(sy.ram || 0) + '%');
    bar('DISK', sy.disk, (sy.free !== undefined ? sy.free + 'G free' : ''));
    if (sy.bat !== undefined) bar('BATTERY', sy.bat, sy.bat + '%' + (sy.plug ? ' ⚡' : ''));
    if (sy.up) {
      const h = Math.floor(sy.up / 3600);
      v.append(el('b', '', 'UPTIME'), el('div'), el('span', '', h + 'h ' + Math.floor((sy.up % 3600) / 60) + 'm'));
    }
  }
}
poll();

/* ---------- Arc Reactor Canvas Engine (Neon Green on Pitch Black) ---------- */
const PARTS = Array.from({ length: 45 }, () => ({
  x: Math.random(),
  y: Math.random(),
  v: 8 + Math.random() * 16,
  r: 0.5 + Math.random() * 1,
  a: 0.06 + Math.random() * 0.2
}));

const ORBITS = Array.from({ length: 6 }, (_, i) => ({
  speed: 0.5 + Math.random() * 0.4,
  dist: 0.88 + Math.random() * 0.22,
  phase: (i / 6) * Math.PI * 2,
  size: 1.4 + Math.random() * 1.2
}));

const GL = [];
for (const lat of [-60, -30, 0, 30, 60]) {
  const p = [];
  const la = lat * Math.PI / 180;
  for (let j = 0; j <= 48; j++) {
    const a = j / 48 * Math.PI * 2;
    p.push([Math.cos(la) * Math.cos(a), Math.sin(la), Math.cos(la) * Math.sin(a)]);
  }
  GL.push(p);
}
for (let k = 0; k < 10; k++) {
  const lon = k / 10 * Math.PI;
  const p = [];
  for (let j = 0; j <= 48; j++) {
    const b = j / 48 * Math.PI * 2;
    p.push([Math.cos(b) * Math.cos(lon), Math.sin(b), Math.cos(b) * Math.sin(lon)]);
  }
  GL.push(p);
}

const col = (l, a) => `hsla(145, 100%, ${l}%, ${a})`;

function globe(cx, cy, r, t) {
  const ry = t * 0.35, tx = 0.4;
  const cyc = Math.cos(ry), syc = Math.sin(ry), ct = Math.cos(tx), stt = Math.sin(tx);
  const fr = new Path2D(), bk = new Path2D();

  for (const pts of GL) {
    let prev = null;
    for (const p of pts) {
      const x = p[0] * cyc + p[2] * syc;
      const z = -p[0] * syc + p[2] * cyc;
      const y = p[1];
      const y2 = y * ct - z * stt;
      const z2 = y * stt + z * ct;
      const px = cx + x * r;
      const py = cy + y2 * r;
      if (prev) {
        const P = z2 >= 0 ? fr : bk;
        P.moveTo(prev[0], prev[1]);
        P.lineTo(px, py);
      }
      prev = [px, py];
    }
  }
  g.lineWidth = 0.6;
  g.strokeStyle = col(30, 0.15);
  g.stroke(bk);
  g.strokeStyle = col(50, 0.55);
  g.stroke(fr);
}

function reactor(cx, cy, R, t) {
  g.lineCap = 'round';

  // Outer precision ring
  g.save();
  g.translate(cx, cy);
  g.rotate(t * 0.04);
  g.lineWidth = 1;
  g.strokeStyle = col(45, 0.35);
  g.beginPath();
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2;
    const l = (i % 10 === 0) ? 10 : ((i % 5 === 0) ? 6 : 2.5);
    g.moveTo(Math.cos(a) * R, Math.sin(a) * R);
    g.lineTo(Math.cos(a) * (R - l), Math.sin(a) * (R - l));
  }
  g.stroke();
  g.restore();

  // Segmented arc ring
  g.save();
  g.translate(cx, cy);
  g.rotate(-t * 0.18);
  g.lineWidth = 2;
  g.strokeStyle = col(50, 0.55);
  for (let k = 0; k < 4; k++) {
    g.beginPath();
    g.arc(0, 0, R * 0.91, k * 1.5708 + 0.18, k * 1.5708 + 1.22);
    g.stroke();
  }
  g.restore();

  // Reactive frequency spikes
  const N = 64, r0 = R * 0.62;
  g.strokeStyle = col(55, 0.65);
  g.lineWidth = 1.1;
  g.beginPath();
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + t * 0.1;
    const spike = Math.sin(i * 1.8 + t * 5) * Math.cos(i * 0.4 - t * 2.5);
    const len = 3 + (amp * R * 0.26) * (0.35 + Math.abs(spike));
    g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    g.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
  }
  g.stroke();

  // Wireframe globe core
  globe(cx, cy, R * 0.40, t);

  // Core radial glow
  const pulse = Math.sin(t * 3.5) * 0.035;
  const cr = R * (0.13 + amp * 0.06 + pulse);
  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 2.2);
  rg.addColorStop(0, '#00ff66');
  rg.addColorStop(0.3, col(50, 0.65));
  rg.addColorStop(0.65, col(40, 0.2));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(cx, cy, cr * 2.2, 0, Math.PI * 2);
  g.fill();

  // Orbiting nodes
  for (const orb of ORBITS) {
    const angle = t * orb.speed + orb.phase;
    const ox = cx + Math.cos(angle) * (R * orb.dist);
    const oy = cy + Math.sin(angle) * (R * orb.dist * 0.65);
    g.fillStyle = col(55, 0.75);
    g.beginPath();
    g.arc(ox, oy, orb.size * (1 + amp * 0.5), 0, Math.PI * 2);
    g.fill();
  }
}

function drawBg(dt, t) {
  g.fillStyle = '#000000';
  g.fillRect(0, 0, W, H);

  g.fillStyle = col(50, 0.25);
  for (const p of PARTS) {
    p.y -= p.v * dt / 1000 / H;
    if (p.y < 0) {
      p.y = 1;
      p.x = Math.random();
    }
    g.globalAlpha = p.a;
    g.beginPath();
    g.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  reactor(CX, CY, R, t);
}

function drawWave(t) {
  const w = wv.clientWidth || 160, h = wv.clientHeight || 28, mid = h / 2;
  wg.clearRect(0, 0, w, h);

  wg.strokeStyle = col(35, 0.2);
  wg.lineWidth = 1;
  wg.beginPath();
  wg.moveTo(0, mid);
  wg.lineTo(w, mid);
  wg.stroke();

  const sp = isJarvisSpeaking ? 2.5 : 1;

  for (let k = 0; k < 2; k++) {
    wg.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const nx = x / w;
      const env = Math.sin(nx * Math.PI);
      const wave = Math.sin(nx * (12 + k * 8) + t * (2.2 + k * 1.2) * sp) * (h * 0.42) * amp * env * (1 - k * 0.25);
      const y = mid + wave;
      if (x === 0) wg.moveTo(x, y);
      else wg.lineTo(x, y);
    }
    wg.strokeStyle = col(55 - k * 15, 0.85 - k * 0.3);
    wg.lineWidth = 1.6 - k * 0.4;
    wg.stroke();
  }
}

let last = 0, T = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - last < 25) return;
  const dt = Math.min(ts - last, 100);
  last = ts;
  T += dt / 1000;

  const st = isJarvisSpeaking ? 'speaking' : (isExecuting ? 'thinking' : (S ? S.state : 'idle'));
  let tg;
  switch (st) {
    case 'listening': tg = 0.10 + 0.05 * Math.sin(T * 2); break;
    case 'recognizing': tg = 0.40 + 0.25 * Math.sin(T * 8); break;
    case 'thinking': tg = 0.30 + 0.25 * Math.abs(Math.sin(T * 3)); break;
    case 'speaking': tg = 0.65 + 0.45 * Math.abs(Math.sin(T * 9.5) * Math.sin(T * 5.2)); break;
    default: tg = 0.08;
  }
  amp += (tg - amp) * 0.25;

  drawBg(dt, T);
  drawWave(T);
}
requestAnimationFrame(frame);
})();
</script>
